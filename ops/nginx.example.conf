# Example only: not installed or activated. Configure real TLS files and deployment paths.
# Backend must use NODE_ENV=production, TRUST_PROXY=loopback and BIND_HOST=127.0.0.1.
log_format courier_safe '$time_iso8601 $request_method $status $request_time $upstream_http_x_request_id';
server {
    listen 443 ssl;
    server_name billing.example.test;
    ssl_certificate /etc/ssl/courier/fullchain.pem;
    ssl_certificate_key /etc/ssl/courier/private-key.pem;
    access_log /var/log/nginx/courier-access.log courier_safe;
    root /srv/courier/current/mobile-bill-app;
    client_max_body_size 11m;
    client_body_timeout 10s;
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
