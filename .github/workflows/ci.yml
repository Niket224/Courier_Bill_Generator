{
  "name": "Courier safety CI",
  "on": {
    "pull_request": {"branches": ["main"]},
    "push": {"branches": ["main", "fix/production-hardening"]},
    "workflow_dispatch": {}
  },
  "permissions": {"contents": "read"},
  "concurrency": {"group": "courier-ci-${{ github.ref }}", "cancel-in-progress": true},
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {"name": "Checkout", "uses": "actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3", "with": {"persist-credentials": false}},
        {"name": "Node 24", "uses": "actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903", "with": {"node-version": "24", "cache": "npm", "cache-dependency-path": "package-lock.json\nserver/package-lock.json"}},
        {"name": "Install root dependencies", "run": "npm ci", "env": {"MONGOMS_DISABLE_POSTINSTALL": "1"}},
        {"name": "Install server dependencies", "run": "npm ci --prefix server"},
        {"name": "Install Chromium", "run": "npx playwright install --with-deps chromium"},
        {"name": "PDF inspection tools", "run": "sudo apt-get update && sudo apt-get install -y poppler-utils"},
        {"name": "Syntax and workflow policy", "run": "npm run check"},
        {"name": "Secret and private-artifact safety scan", "run": "npm run check:secrets"},
        {"name": "Unit, isolated API/restore and browser regressions", "run": "npm test"},
        {"name": "Inspect synthetic invoice PDFs", "run": "node scripts/verify-acceptance-pdfs.cjs"},
        {"name": "Coverage", "run": "npm run test:coverage > coverage-report.txt && cat coverage-report.txt"},
        {"name": "Dependency advisories", "run": "npm audit --audit-level=moderate && npm audit --prefix server --audit-level=moderate"},
        {"name": "Disposable operations and recovery drill", "run": "npm run test:operations"},
        {"name": "Upload synthetic verification reports", "if": "always()", "uses": "actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4", "with": {"name": "synthetic-verification", "path": "coverage-report.txt\noutputs/operations-drill.json", "if-no-files-found": "ignore", "retention-days": 7}}
      ]
    }
  }
}
